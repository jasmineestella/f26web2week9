<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Bootstrap 6!</title>
    <!--the bootstrap CSS file
    cdn stands for content delivery network-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <!--bootstrap works by adding classes to HTML for example 
    breakpoints (xs, s, m, lg, xl, 2xl)
    backgrounds (bg)
    foregrounds (fg) -->
    <div class="lg:container bg-primary">
        <header>
            <h1>New Bootstrap 6!</h1>
        </header>

        <main>
            <!--try a bootstrap component - a "drawer" - by copying the code from 
            bootstrap and tweaking it...https://getbootstrap.com/docs/6.0/components/drawer/-->
            <button type="button" class="btn-solid theme-warning" commandfor="invokerDrawer" command="show-modal">
  Open drawer
</button>
<dialog class="drawer drawer-start" tabindex="-1" id="invokerDrawer" aria-labelledby="invokerDrawerLabel">
  <div class="drawer-header">
    <h5 class="drawer-title" id="invokerDrawerLabel">Invoker Commands</h5>
    <button type="button" class="btn-close" commandfor="invokerDrawer" command="close" aria-label="Close"></button>
  </div>
  <div class="drawer-body">
    <p>This drawer opens with <code>command="show-modal"</code> and closes with <code>command="close"</code>. No Bootstrap JavaScript is involved.</p>
  </div>
</dialog>
 
<!--check boxes-->
<div class="form-field">
  <input type="checkbox" id="checkaccent" class="check theme-accent" checked />
  <label for="checkaccent">Example accent checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checksuccess" class="check theme-success" checked />
  <label for="checksuccess">Example success checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checkdanger" class="check theme-danger" checked />
  <label for="checkdanger">Example danger checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checkwarning" class="check theme-warning" checked />
  <label for="checkwarning">Example warning checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checkinfo" class="check theme-info" checked />
  <label for="checkinfo">Example info checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checkinverse" class="check theme-inverse" checked />
  <label for="checkinverse">Example inverse checkbox</label>
</div>
<div class="form-field">
  <input type="checkbox" id="checksecondary" class="check theme-secondary" checked />
  <label for="checksecondary">Example secondary checkbox</label>
</div>
        </main>

        <section>
            <!--bootstrap's grid!-->
            
            <!--The grid system is based on a 12-column layout. (which you can set columns to be different sizes)
            
            p-3 is padding - 0.5em -you can have padding classes and margin classes (ie. m-8)-->
            <div class="row bg-success fg-contrast-success">
                <div class="md:col-8 p-3">1 column</div>
                <div class="sm:col p-3">2 column</div>
                <div class="sm:col p-3">3 column</div>
            </div>
        </section>
        
    </div>

    <!--bootstrap javascript file-->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
